;PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Schéma de partition pour applications volumineuses (3MB app)
board_build.partitions = huge_app.csv

; Vitesse de communication série
monitor_speed = 115200

; Bibliothèques requises
lib_deps = 
    ; Librarie pour contrôler les panneaux LED HUB75
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.0
    
    ; Librairie Adafruit GFX pour les graphiques
    adafruit/Adafruit GFX Library@^1.11.0
    
    ; NimBLE-Arduino pour BLE (plus léger et stable que BLE standard)
    h2zero/NimBLE-Arduino@^1.4.1
    
    ; PNGdec pour afficher les images PNG
    bitbank2/PNGdec@^1.0.1
    
; Options de build
build_flags = 
    ; Optimisation pour performance
    -O2
    
    ; Taille de partition pour OTA (optionnel)
    -D BOARD_HAS_PSRAM
    
    ; Configuration mémoire
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    
; Options d'upload
upload_speed = 921600

; Moniteur série
monitor_filters = 
    esp32_exception_decoder
    colorize
    time

; Port série (décommenter et adapter si nécessaire)
; upload_port = COM3
; monitor_port = COM3
