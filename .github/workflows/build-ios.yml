name: Build iOS App

on:
  # Déclencher manuellement depuis GitHub
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - ipa
  
  # Déclencher sur push vers main (optionnel)
  push:
    branches:
      - main
    paths:
      - 'padel_mobile_app/**'
      - '.github/workflows/build-ios.yml'
  
  # Déclencher sur pull request (optionnel)
  pull_request:
    branches:
      - main
    paths:
      - 'padel_mobile_app/**'

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest  # Runner macOS avec Xcode
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'  # Version avec Dart 3.9.2
          channel: 'stable'
          cache: true
      
      - name: 🔍 Flutter Doctor
        run: flutter doctor -v
      
      - name: 📦 Get Flutter Dependencies
        working-directory: ./padel_mobile_app
        run: flutter pub get
      
      - name: 🧹 Clean Project
        working-directory: ./padel_mobile_app
        run: flutter clean
      
      - name: 🔧 Install CocoaPods Dependencies
        working-directory: ./padel_mobile_app/ios
        run: |
          sudo gem install cocoapods
          pod install
      
      - name: 🏗️ Build iOS Debug
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        working-directory: ./padel_mobile_app
        run: flutter build ios --debug --no-codesign
      
      - name: 🏗️ Build iOS Release
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: ./padel_mobile_app
        run: flutter build ios --release --no-codesign
      
      - name: 📦 Build IPA (Release)
        if: ${{ github.event.inputs.build_type == 'ipa' }}
        working-directory: ./padel_mobile_app
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist || flutter build ipa --release --no-codesign
      
      - name: 📊 Get Build Info
        id: build_info
        working-directory: ./padel_mobile_app
        run: |
          echo "version=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2)" >> $GITHUB_OUTPUT
          echo "build_date=$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT
      
      - name: 📤 Upload iOS Build (Debug/Release)
        if: ${{ github.event.inputs.build_type != 'ipa' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-${{ github.event.inputs.build_type || 'debug' }}-${{ steps.build_info.outputs.build_date }}
          path: |
            padel_mobile_app/build/ios/iphoneos/Runner.app
            padel_mobile_app/build/ios/Release-iphoneos/Runner.app
          retention-days: 30
          if-no-files-found: warn
      
      - name: 📤 Upload IPA
        if: ${{ github.event.inputs.build_type == 'ipa' }}
        uses: actions/upload-artifact@v4
        with:
          name: padel-display-v${{ steps.build_info.outputs.version }}-${{ steps.build_info.outputs.build_date }}.ipa
          path: padel_mobile_app/build/ios/ipa/*.ipa
          retention-days: 90
          if-no-files-found: warn
      
      - name: ✅ Build Summary
        run: |
          echo "### 🎉 Build iOS Terminé!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ github.event.inputs.build_type || 'debug' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.build_info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: ${{ steps.build_info.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Xcode**: $(xcodebuild -version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter**: $(flutter --version | head -n 1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 L'artifact est disponible dans l'onglet 'Actions' de ce workflow." >> $GITHUB_STEP_SUMMARY
