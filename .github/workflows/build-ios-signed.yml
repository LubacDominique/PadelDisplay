name: Build iOS App (Signed)

# Ce workflow nécessite des certificats Apple Developer
# À utiliser uniquement si vous avez un compte Developer

on:
  workflow_dispatch:
    inputs:
      distribution_method:
        description: 'Méthode de distribution'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - development
          - ad-hoc
          - app-store
          - enterprise

jobs:
  build-signed-ios:
    name: Build & Sign iOS Application
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🔐 Configure Apple Certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Créer le keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Importer le certificat
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # Installer le provisioning profile
          PROVISION_PROFILE_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PROVISION_PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISION_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles
      
      - name: 🍎 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'
      
      - name: 📱 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'  # Version avec Dart 3.9.2
          channel: 'stable'
          cache: true
      
      - name: 📦 Get Dependencies
        working-directory: ./padel_mobile_app
        run: |
          flutter pub get
          cd ios && pod install && cd ..
      
      - name: 🏗️ Build & Sign IPA
        working-directory: ./padel_mobile_app
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist
      
      - name: 📤 Upload Signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: padel-display-signed-${{ github.event.inputs.distribution_method }}-${{ github.run_number }}
          path: padel_mobile_app/build/ios/ipa/*.ipa
          retention-days: 90
      
      - name: 🧹 Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
      
      - name: ✅ Success Summary
        run: |
          echo "### 🎉 Build iOS Signé Terminé!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Distribution**: ${{ github.event.inputs.distribution_method }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Téléchargez l'IPA depuis l'onglet Artifacts." >> $GITHUB_STEP_SUMMARY
